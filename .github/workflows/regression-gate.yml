name: Regression Gate

on:
  pull_request:
    paths:
      - "src/Editor/**"
      - "engine/src/**"
      - "tests/**"
      - "playwright.config*.ts"
      - "vitest.config.ts"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - "src/Editor/**"
      - "engine/src/**"
      - "tests/**"
      - "playwright.config*.ts"
      - "vitest.config.ts"
      - "package.json"
      - "package-lock.json"

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build engine bundle
        run: npm run build:engine

      - name: Run clipboard guard regression test
        run: npm run test:unit -- --run tests/engine/clipboard-guards.test.ts

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run active tool regression test
        run: npx playwright test tests/regression-active-tool.spec.ts --config=playwright.config.dev.ts --project=chromium
