[build]
  # Reinstall with a recent npm and include optional deps so Rollup native binary is installed on Linux
  command = "npm i -g npm@11 && npm install --include=optional && npm run build"
  
  # The directory that contains the deploy-ready assets
  publish = "build"

[build.environment]
  # Ensure we use at least Node 22 as specified in package.json
  NODE_VERSION = "22"

  # Ensure optional dependencies are included during dependency install
  NPM_FLAGS = "--include=optional"
  
  # Prevent unwanted Electron-related downloads/installs if any survived
  ELECTRON_SKIP_BINARY_DOWNLOAD = "1"

[[redirects]]
  # Basic redirect for Single Page Application (SPA) routing
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
